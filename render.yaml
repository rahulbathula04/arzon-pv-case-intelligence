services:
  - type: web
    name: arzon-pv-case-intelligence
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: arzon-pv-data
      mountPath: /app/data
      sizeGB: 1
